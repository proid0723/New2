name: secnews

# Runs on GitHub-hosted runners (free for public repositories). Never point a public
# repository's workflows at a self-hosted runner: a pull request from a fork could run
# code on that machine.
on:
  schedule:
    # Every 5 minutes: new /start subscribers are picked up and welcomed. News goes out on the
    # first run of each clock hour (digest_on_the_hour in feeds.json). GitHub may start late.
    - cron: '*/5 * * * *'
    # Hourly check that the 5-minute runs (started by cron-job.org) are still coming.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Forget what was already sent and send the current news again'
        type: boolean
        default: false
      test_me:
        description: 'Test: send only to the administrator; preserve news/subscriber state but record API usage. Untick to send to everyone.'
        type: boolean
        default: true
      list_chats:
        description: 'Only list who messaged the bot recently (no news is sent)'
        type: boolean
        default: false
      scheduled:
        description: 'Behave like the timer (used by the external cron-job.org ping, which is more punctual than GitHub schedules)'
        type: boolean
        default: false
      verbose:
        description: 'Keep detailed encrypted diagnostics; public output always contains structural summaries only'
        type: boolean
        default: false
      item_style:
        description: 'Try a message layout without changing the settings: "quote" puts each article in a box (leave empty for the configured one)'
        type: string
        default: ''
      review_now:
        description: 'Only copy this week''s decisions so far to New2_config/reports for review (no news is sent; untick test_me too)'
        type: boolean
        default: false
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule' && !inputs.scheduled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # The only package: cryptography, for the subscriber file's AES-256-GCM. Exact files only.
      - name: Install cryptography
        run: python3 -m pip install -q --disable-pip-version-check --break-system-packages --require-hashes -r requirements.txt
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  send:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
      || (github.event_name == 'workflow_dispatch' && !inputs.list_chats)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never run two senders at once, or both could send the same items.
    concurrency:
      # Tests preserve news state and publish only API usage; they never hold up timer alerts.
      group: secnews-send${{ (inputs.test_me && !inputs.scheduled) && '-test' || '' }}
      cancel-in-progress: false
    env:
      SECNEWS_STATE: ${{ github.workspace }}/.state/seen.json
      # Keywords and sources live in a private repository once CONFIG_REPO_TOKEN is set
      # (read-only access to <owner>/New2_config). The public repository has no feeds.json.
      HAS_PRIVATE_CONFIG: ${{ secrets.CONFIG_REPO_TOKEN != '' }}
      SECNEWS_TEST_USAGE_DIR: ${{ github.workspace }}/.private-config/api-usage
    steps:
      - uses: actions/checkout@v5
      - name: Fetch private settings
        if: env.HAS_PRIVATE_CONFIG == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/New2_config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: .private-config
          persist-credentials: false
      # Only ciphertext is uploaded to the public cache. Legacy plaintext is read once for
      # migration when no encrypted cache exists; it is never written by this workflow.
      - name: Restore encrypted runtime state
        id: encrypted-state
        uses: actions/cache/restore@v5
        with:
          path: .state-cache
          key: secnews-encrypted-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: secnews-encrypted-state-v1-
      - name: Restore sent-item state
        if: steps.encrypted-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: secnews-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: secnews-state-
      # The only package: cryptography, for the subscriber file's AES-256-GCM. Exact files only.
      - name: Install cryptography
        run: python3 -m pip install -q --disable-pip-version-check --break-system-packages --require-hashes -r requirements.txt
      - name: Decrypt runtime state
        if: steps.encrypted-state.outputs.cache-matched-key != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/state_cache.py open
      # The subscriber list is also backed up (still encrypted) in the private repository, so a
      # cache that was evicted or deleted does not lose everyone who subscribed.
      - name: Restore subscribers from the backup
        run: |
          if [ ! -f .state/subscribers.json ] && [ -f .private-config/backup/subscribers.json ]; then
            mkdir -p .state && cp .private-config/backup/subscribers.json .state/subscribers.json
            echo "::warning::Subscriber list restored from the backup in New2_config"
          fi
      - name: Collect and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Manual runs are tests unless test_me is unticked; the external timer's runs never are.
          TEST_ME: ${{ inputs.test_me && !inputs.scheduled }}
          TEST_CHAT: ${{ secrets.TELEGRAM_TEST_CHAT_ID || secrets.TELEGRAM_TEST_CHAT_IDS }}
          # The owner (the test chat) hears about feeds that keep failing.
          SECNEWS_ADMIN_CHAT: ${{ secrets.TELEGRAM_TEST_CHAT_ID || secrets.TELEGRAM_TEST_CHAT_IDS }}
          RESET_FLAG: ${{ inputs.reset && '--reset' || '' }}
          SECNEWS_VERBOSE: ${{ inputs.verbose && '1' || '' }}
          TIMER_RUN: ${{ github.event_name == 'schedule' || inputs.scheduled }}
          REVIEW_NOW: ${{ inputs.review_now && !inputs.scheduled }}
          SECNEWS_ITEM_STYLE: ${{ !inputs.scheduled && inputs.item_style || '' }}
          SECNEWS_TEST_USAGE_EVENT: ${{ (inputs.test_me && !inputs.scheduled) && format('{0}/secnews-api-usage/{1}-{2}.json', runner.temp, github.run_id, github.run_attempt) || '' }}
        # Timer runs (GitHub schedule or the external ping) wait for the hourly digest, and a run
        # with no saved state only records the current news. Manual runs send now.
        run: |
          if [ -f .private-config/feeds.json ]; then
            export SECNEWS_CONFIG="$PWD/.private-config/feeds.json"
            echo "settings: private repository"
          elif [ ! -f feeds.json ]; then
            echo "::error::No settings: feeds.json is not in New2_config (or CONFIG_REPO_TOKEN is missing or expired)."
            exit 1
          fi
          if [ "$REVIEW_NOW" = "true" ]; then
            python3 secnews.py --write-review
          elif [ "$TEST_ME" = "true" ]; then
            if [ -z "$(echo "$TEST_CHAT" | tr -d '[:space:]')" ]; then
              echo "::error::The TELEGRAM_TEST_CHAT_ID secret is empty or missing (Settings > Secrets and variables > Actions > Secrets). A test never goes to subscribers."
              exit 1
            fi
            SECNEWS_ONLY_CHATS="$TEST_CHAT" python3 secnews.py
          elif [ "$TIMER_RUN" = "true" ]; then
            python3 secnews.py --quiet-first-run
          else
            python3 secnews.py --now $RESET_FLAG
          fi
      - name: Upload encrypted failure diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .diagnostics-cache/*.enc
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # Tests publish increments only. Never save their .state copy over production news state.
      - name: Record administrator test API usage
        if: always() && inputs.test_me && !inputs.scheduled && env.HAS_PRIVATE_CONFIG == 'true'
        env:
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          USAGE_EVENT: ${{ format('{0}/secnews-api-usage/{1}-{2}.json', runner.temp, github.run_id, github.run_attempt) }}
        run: |
          [ -f "$USAGE_EVENT" ] || exit 0
          usage_day="$(python3 -c 'import json,os; print(json.load(open(os.environ["USAGE_EVENT"]))["day"])')"
          mkdir -p ".private-config/api-usage/$usage_day"
          cp "$USAGE_EVENT" ".private-config/api-usage/$usage_day/test-${{ github.run_id }}-${{ github.run_attempt }}.json"
          basic="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          cd .private-config
          branch="$(git symbolic-ref --short -q HEAD || echo main)"
          git add "api-usage/$usage_day/test-${{ github.run_id }}-${{ github.run_attempt }}.json"
          git diff --cached --quiet && exit 0
          git -c user.name="secnews" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Record administrator test API requests"
          for try in 1 2; do
            git -c http.extraheader="$auth" pull -q --rebase origin "$branch" && \
              git -c http.extraheader="$auth" push -q origin HEAD:"$branch" && exit 0
          done
          echo "::error::Could not preserve administrator test API usage"
          exit 1
      - name: Tell the owner the run failed
        if: failure() && (github.event_name == 'schedule' || inputs.scheduled)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_TEST_CHAT_ID || secrets.TELEGRAM_TEST_CHAT_IDS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Timer runs come every 5 minutes; only the first of each hour reports, so a lasting
        # outage means one message an hour, not twelve.
        run: |
          [ -n "$CHAT" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          [ "$(date -u +%-M)" -lt 5 ] || exit 0
          curl -s -o /dev/null --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ 보안 속보 봇 실행이 실패했어요. 로그: $RUN_URL" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" || true
      # Needs CONFIG_REPO_TOKEN with Contents: Read and write on New2_config. Commits only when
      # someone joins or leaves; a read-only token just leaves a warning.
      - name: Back up subscribers
        if: success() && !(inputs.test_me && !inputs.scheduled) && env.HAS_PRIVATE_CONFIG == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          [ "$(python3 secnews.py --backup-subscribers .private-config/backup/subscribers.json)" = changed ] || exit 0
          basic="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          cd .private-config
          branch="$(git symbolic-ref --short -q HEAD || echo main)"
          git add backup/subscribers.json
          git -c user.name="secnews" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Back up subscriber list"
          for try in 1 2; do
            git -c http.extraheader="$auth" pull -q --rebase origin "$branch" && \
              git -c http.extraheader="$auth" push -q origin HEAD:"$branch" && exit 0
          done
          echo "::warning::Could not push the subscriber backup (CONFIG_REPO_TOKEN needs Contents: Read and write)"
      # Monday's weekly review file goes to New2_config/reports, where the weekly review reads it.
      # It leaves .state only once pushed, so a failed push is retried on the next run.
      - name: Hand over the weekly review file
        if: success() && (!(inputs.test_me && !inputs.scheduled) || (inputs.review_now && !inputs.scheduled)) && env.HAS_PRIVATE_CONFIG == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          ls .state/reviews/*.json >/dev/null 2>&1 || exit 0
          basic="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          mkdir -p .private-config/reports && cp .state/reviews/*.json .private-config/reports/
          cd .private-config
          branch="$(git symbolic-ref --short -q HEAD || echo main)"
          git add reports
          git -c user.name="secnews" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Weekly review file"
          for try in 1 2; do
            if git -c http.extraheader="$auth" pull -q --rebase origin "$branch" && \
               git -c http.extraheader="$auth" push -q origin HEAD:"$branch"; then
              rm -f ../.state/reviews/*.json
              exit 0
            fi
          done
          echo "::warning::Could not push the weekly review file"
      - name: Encrypt runtime state
        if: success() && !(inputs.test_me && !inputs.scheduled)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/state_cache.py seal
      - name: Save encrypted runtime state
        if: success() && !(inputs.test_me && !inputs.scheduled)
        uses: actions/cache/save@v5
        with:
          path: .state-cache
          key: secnews-encrypted-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

  # A run that never starts cannot report itself: tell the admin when the 5-minute runs stop.
  watchdog:
    if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned dependency
        run: python3 -m pip install -q --disable-pip-version-check --break-system-packages --require-hashes -r requirements.txt
      - name: Check that the timer still runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT: ${{ secrets.TELEGRAM_TEST_CHAT_ID || secrets.TELEGRAM_TEST_CHAT_IDS }}
        run: python3 tools/watchdog.py
      - name: Upload encrypted failure diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .diagnostics-cache/*.enc
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  chats:
    if: github.event_name == 'workflow_dispatch' && inputs.list_chats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECNEWS_STATE: ${{ github.workspace }}/.state/seen.json
    steps:
      - uses: actions/checkout@v5
      - name: Restore encrypted runtime state
        id: encrypted-state
        uses: actions/cache/restore@v5
        with:
          path: .state-cache
          key: secnews-encrypted-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: secnews-encrypted-state-v1-
      - name: Restore subscriber list
        if: steps.encrypted-state.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: secnews-state-${{ github.run_id }}
          restore-keys: secnews-state-
      - name: Install cryptography
        run: python3 -m pip install -q --disable-pip-version-check --break-system-packages --require-hashes -r requirements.txt
      - name: Decrypt runtime state
        if: steps.encrypted-state.outputs.cache-matched-key != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/state_cache.py open
      - name: Who messaged the bot
        env:
          # The chat-id secret is left out on purpose: GitHub would mask those ids in this log.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 tools/get_chat_ids.py
      - name: Upload encrypted diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chat-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .diagnostics-cache/*.enc
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
