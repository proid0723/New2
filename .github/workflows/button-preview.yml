name: Admin layout preview
on:
  workflow_dispatch:
    inputs:
      style:
        description: Layout to preview only for the administrator
        type: choice
        default: buttons
        options:
          - buttons
          - all_links
          - all_links_ko
          - outside_title_ko
          - outside_plain_summary_ko
          - outside_padded_title_ko
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/New2_config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: .private-config
          persist-credentials: false
      - name: Install pinned dependency
        run: python3 -m pip install -q --disable-pip-version-check --break-system-packages --require-hashes -r requirements.txt
      - name: Send preview only to administrator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_CHAT: ${{ secrets.TELEGRAM_TEST_CHAT_ID || secrets.TELEGRAM_TEST_CHAT_IDS }}
          SECNEWS_CONFIG: .private-config/feeds.json
          PREVIEW_STYLE: ${{ inputs.style }}
        run: python3 tools/preview_buttons.py
      - name: Upload encrypted failure diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: preview-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .diagnostics-cache/*.enc
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
